name: Validate Email Signatures

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check JavaScript syntax
        run: |
          node --check scripts/config-loader.js
          node --check scripts/signature-generator.js

      - name: Run compatibility and asset checks
        run: node tests/signature.test.js
